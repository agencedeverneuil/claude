<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <pattern id="stripes-10" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="black" stroke-width="1.2"/>
    </pattern>
    <clipPath id="clip-10">
      <polygon points="25,15 75,15 90,85 10,85"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-10)">
    <polygon points="25,15 50,15 50,85 10,85" fill="url(#stripes-10)"/>
    <polygon points="50,15 75,15 90,85 50,85" fill="black"/>
  </g>
  <polygon points="25,15 75,15 90,85 10,85"
           fill="none" stroke="black" stroke-width="2" stroke-linejoin="miter"/>
  <line x1="50" y1="15" x2="50" y2="85" stroke="black" stroke-width="2"/>
</svg>
