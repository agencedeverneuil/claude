<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <pattern id="stripes-20" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="black" stroke-width="1.2"/>
    </pattern>
    <clipPath id="clip-20a">
      <polygon points="10,80 35,30 60,80"/>
    </clipPath>
    <clipPath id="clip-20b">
      <polygon points="50,80 70,45 90,80"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-20a)">
    <rect x="0" y="0" width="100" height="100" fill="url(#stripes-20)"/>
  </g>
  <g clip-path="url(#clip-20b)">
    <rect x="0" y="0" width="100" height="100" fill="black"/>
  </g>
  <polygon points="10,80 35,30 60,80" fill="none" stroke="black" stroke-width="2" stroke-linejoin="miter"/>
  <polygon points="50,80 70,45 90,80" fill="none" stroke="black" stroke-width="2" stroke-linejoin="miter"/>
  <line x1="5" y1="80" x2="95" y2="80" stroke="black" stroke-width="2"/>
</svg>
