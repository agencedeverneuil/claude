<!doctype html>
<html lang="fr">

  <link rel="stylesheet" href="src/styles.css" />

<body style="background-color: rgb(255, 255, 255); font-family: Inter; font-size: 13px">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script src="src/templates.js"></script>
  <script type="text/babel" src="src/tweaks-panel.jsx"></script>

  <script type="text/babel" src="src/views.jsx"></script>

  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => console.warn('SW registration failed', err));
      });
    }
  </script>
